schemaVersion: 1
name: netsuite-account-raw
title: NetSuite Account Raw Ingest
description: >
  Extracts NetSuite Account records into the shared raw.source_record /
  raw.source_load envelope for the revenue pipeline POC. Raw layer only —
  1:1 row-level JSON capture, no aggregation, no staging/mart logic.

variables:
  database:
    description: Shared raw database for the NetSuite revenue POC, written to by all netsuite-*-raw Flights.
    default: netsuite_revenue_poc
  schema:
    description: Raw schema holding the shared source_record / source_load tables.
    default: raw
  source_object:
    default: Account
  natural_key_columns:
    description: Comma-separated natural key column(s) used to build source_record_id and to merge.
    default: id
  lastmodified_column:
    default: lastmodifieddate
  lookback_days:
    description: Steady-state incremental rolling lookback window, in days.
    default: "7"
  backfill_mode:
    description: "'true' runs a one-time full historical backfill (no date bound — Account is a dimension) instead of the steady-state incremental window."
    default: "false"

resources:
  flights:
    loader:
      name: netsuite-account-raw
      source: src/flight.py
      requirements: src/requirements.txt
      scheduleCron: 0 6 * * 1
      maxRuntimeSec: 900
      runOnDeploy: true
      waitForRun: success
      secrets:
        - netsuite_tba
      config:
        database: ${var.database}
        schema: ${var.schema}
        source_object: ${var.source_object}
        source_system: netsuite
        natural_key_columns: ${var.natural_key_columns}
        lastmodified_column: ${var.lastmodified_column}
        lookback_days: ${var.lookback_days}
        backfill_mode: ${var.backfill_mode}
      targets:
        preview:
          name: netsuite-account-raw:${target.branch} (Preview)
          scheduleCron: ""
          runOnDeploy: true
          config:
            database: ${var.database}${var.preview_suffix}
