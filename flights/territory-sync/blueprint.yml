schemaVersion: 1
name: territory-sync
title: Territory Snapshot Sync
description: Apply a dated territory lookup snapshot to assignment history.

resources:
  flights:
    sync:
      name: territory-sync-sandbox
      source: src/flight.py
      requirements: src/requirements.txt
      runOnDeploy: false
      config:
        SOURCE_DATABASE: css
        SOURCE_TABLE: ""
      targets:
        preview:
          name: territory-sync:${target.branch_slug} (Preview)